<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه جامع آموزشی دانشگاه آفاق</title>
<style>
  :root{
    --primary:#1e40af; --primary-dark:#1e3a8a; --primary-light:#dbeafe;
    --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --green:#059669; --green-bg:#d1fae5; --red:#dc2626; --red-bg:#fee2e2;
    --amber:#d97706; --amber-bg:#fef3c7; --border:#e2e8f0; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Vazirmatn','Segoe UI',Tahoma,Arial,sans-serif}
  body{background:var(--bg);color:var(--text);font-size:14px}
  /* ─── ورود ─── */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a8a,#1e40af 50%,#312e81);padding:20px}
  .login-card{background:#fff;border-radius:20px;padding:36px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
  .login-card h1{font-size:20px;margin-bottom:4px}
  .login-card .sub{color:var(--muted);margin-bottom:22px;font-size:13px}
  .logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#1e40af,#3b82f6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
  input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;transition:.15s}
  input:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;font-family:inherit}
  .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
  .btn-green{background:var(--green);color:#fff}.btn-green:hover{filter:brightness(1.08)}
  .btn-red{background:var(--red);color:#fff}
  .btn-amber{background:var(--amber);color:#fff}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-block{width:100%;margin-top:18px}
  .demo-accounts{margin-top:22px;border-top:1px dashed var(--border);padding-top:16px}
  .demo-accounts b{font-size:12px;color:var(--muted);display:block;margin-bottom:8px}
  .chip{display:inline-block;background:var(--primary-light);color:var(--primary-dark);border:none;border-radius:20px;padding:6px 11px;font-size:11.5px;margin:0 0 6px 6px;cursor:pointer;font-family:inherit;font-weight:600;transition:.15s}
  .chip:hover{filter:brightness(.95)}
  /* ─── چیدمان اصلی ─── */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:250px;background:linear-gradient(180deg,#1e3a8a,#172554);color:#e2e8f0;padding:20px 0;flex-shrink:0;display:flex;flex-direction:column}
  .sidebar .brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
  .sidebar .brand h2{font-size:16px;color:#fff}
  .sidebar .brand span{font-size:11px;color:#93c5fd}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13.5px;cursor:pointer;color:#cbd5e1;border:none;background:none;width:100%;text-align:right;font-family:inherit;font-weight:600;transition:.15s}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item.active{background:rgba(59,130,246,.25);color:#fff;border-left:3px solid #60a5fa}
  .sidebar .user-box{margin-top:auto;padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  .sidebar .user-box b{display:block;color:#fff;font-size:13px}
  .main{flex:1;padding:24px 28px;max-width:calc(100vw - 250px);overflow-x:auto}
  .page-title{font-size:19px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  /* ─── اجزاء ─── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
  .grid{display:grid;gap:16px}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .stat .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .stat .val{font-size:22px;font-weight:800}
  .stat .hint{font-size:11px;color:var(--muted);margin-top:5px}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
  .b-green{background:var(--green-bg);color:var(--green)} .b-red{background:var(--red-bg);color:var(--red)}
  .b-amber{background:var(--amber-bg);color:var(--amber)} .b-blue{background:var(--primary-light);color:var(--primary-dark)}
  .b-gray{background:#e2e8f0;color:#475569}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8fafc;color:var(--muted);font-size:11.5px;text-align:right;padding:10px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:hover td{background:#f8fafc}
  .toast-wrap{position:fixed;bottom:20px;left:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
  .toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 25px rgba(0,0,0,.3);animation:fade .25s;max-width:420px}
  .toast.err{background:var(--red)}.toast.ok{background:var(--green)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
  .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .kv:last-child{border:none}
  .kv b{font-weight:700}
  .sla-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:16px}
  .sla-ON_TIME{background:var(--green-bg);color:var(--green)}
  .sla-WARNING{background:var(--amber-bg);color:var(--amber)}
  .sla-BREACHED{background:var(--red-bg);color:var(--red)}
  .sla-NO_SLA{background:#e2e8f0;color:#64748b}
  .reasons{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.9}
  pre.json{background:#0f172a;color:#7dd3fc;padding:16px;border-radius:10px;font-size:12px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.7}
  .cart-bar{position:sticky;bottom:14px;background:#0f172a;color:#fff;border-radius:14px;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 35px rgba(0,0,0,.3);flex-wrap:wrap;gap:10px}
  .cart-bar .units{font-size:13px}.cart-bar .units b{color:#93c5fd;font-size:16px}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .offering{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .offering:last-child{border:none}
  .offering .title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .code-tag{background:var(--primary-light);color:var(--primary-dark);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;direction:ltr}
  .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.8}
  .cap-bar{height:5px;border-radius:4px;background:#e2e8f0;overflow:hidden;margin-top:7px;max-width:230px}
  .cap-fill{height:100%;border-radius:4px}
  .cap-warn{background:var(--amber)}.cap-full{background:var(--red)}.cap-ok{background:var(--green)}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:10px;background:#fff;border:1.5px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;color:var(--muted)}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .term-block{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
  .term-block h4{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .appeal-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;margin:10px 0;font-size:13px;line-height:2}
  h3.sec{font-size:15px;margin-bottom:12px;color:var(--primary-dark)}
  .gpa-circle{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:86px;height:86px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);font-weight:800;font-size:20px;border:3px solid var(--primary)}
  .gpa-circle small{font-size:10px;font-weight:600}
  .strike{color:#94a3b8;text-decoration:line-through}
  .seat{width:52px;height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:1.5px solid transparent;transition:.12s;overflow:hidden}
  .seat b{font-size:12px}
  .seat:hover{transform:scale(1.08);border-color:var(--primary)}
  .seat.absent{opacity:.45;border-color:var(--red);background:var(--red-bg)!important}
  .seat.selected-absent{outline:2.5px solid var(--red)}
  .seat-grid{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;font-size:11.5px}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block;margin-left:4px;vertical-align:-2px}
  .entry-card{border:2px solid var(--primary);border-radius:14px;padding:22px;background:#fff;max-width:760px}
  .entry-card .head{display:flex;justify-content:space-between;border-bottom:2px dashed var(--border);padding-bottom:12px;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .entry-card .barcode{font-family:monospace;letter-spacing:2px;background:#0f172a;color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;direction:ltr}
  .photo-box{width:74px;height:92px;border:2px dashed var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
  @media print{.sidebar,.cart-bar,.no-print{display:none!important}.main{max-width:100%}}
  .star{color:var(--amber)}
</style>
</head>
<body>

<!-- ═══════ صفحه ورود ═══════ -->
<div id="loginPage" class="login-wrap">
  <div class="login-card">
    <div class="logo">🎓</div>
    <h1>سامانه جامع آموزشی</h1>
    <div class="sub">دانشگاه آفاق — فاز صفر (هسته قابل اجرا)</div>
    <label>کد ملی</label>
    <input id="loginNc" placeholder="مثلاً 1010101010" dir="ltr">
    <label>رمز عبور</label>
    <input id="loginPass" type="password" placeholder="••••••" dir="ltr">
    <button class="btn btn-primary btn-block" onclick="doLogin()">ورود به سامانه</button>
    <div class="demo-accounts">
      <b>حساب‌های نمونه (رمز: 123456) — برای ورود سریل کلیک کنید:</b>
      <div id="demoChips"></div>
    </div>
  </div>
</div>

<!-- ═══════ پنل اصلی ═══════ -->
<div id="appPage" class="layout" style="display:none">
  <aside class="sidebar">
    <div class="brand"><h2>🎓 دانشگاه آفاق</h2><span>سامانه جامع آموزشی — v0.1</span></div>
    <div id="navMenu"></div>
    <div class="user-box"><b id="uName"></b><span id="uRoles"></span><br><button class="btn btn-ghost" style="margin-top:8px;padding:6px 12px;font-size:12px;color:#cbd5e1;border-color:#334155" onclick="logout()">خروج</button></div>
  </aside>
  <main class="main" id="mainArea"></main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
/* ═══════════════ وضعیت سراسری ═══════════════ */
// ذخیره‌سازی مقاوم: localStorage → در صورت مسدودسازی، متغیر درون‌حافظه + هش URL
var __memTok = '';
function tokGet() {
  var h = (location.hash.match(/t=([a-f0-9]+)/) || [])[1] || '';
  try { return localStorage.getItem('afagh_token') || __memTok || h; } catch (e) { return __memTok || h; }
}
function tokSet(v) {
  __memTok = v;
  try { localStorage.setItem('afagh_token', v); } catch (e) { try { history.replaceState(null, '', '#t=' + v); } catch (e2) {} }
}
function tokDel() {
  __memTok = '';
  try { localStorage.removeItem('afagh_token'); } catch (e) {}
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}
let TOKEN = tokGet();
let ME = null;
const API = (path, opts = {}) => fetch(path, {
  ...opts,
  headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN, ...(opts.headers||{}) }
}).then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error || 'خطا'); return d; });

const fa = n => (n===null||n===undefined) ? '—' : Number(n).toLocaleString('fa-IR');
const faNum = n => (n===null||n===undefined) ? '—' : String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function toast(msg, type=''){ const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.getElementById('toasts').appendChild(t); setTimeout(()=>t.remove(), 5000); }

/* ═══════════════ ورود ═══════════════ */
const DEMOS = [
  ['1010101010','👨‍🎓 دانشجو (عادی)'],['1010101011','👩‍🎓 دانشجو (معدل الف)'],['1010101012','🧑‍🎓 دانشجو (مشروطی)'],
  ['1010101013','👩‍🎓 شاهد (بدون تسویه)'],['1010101014','🧓 ورودی ۱۳۹۰'],['1010101015','🎓 ترم آخر'],['1010101016','🎓 ارشد'],
  ['0011111111','👨‍🏫 استاد رضایی (ریاضی/پروگرم)'],['0022222222','👩‍🏫 استاد احمدی (داده/پایان‌نامه)'],
  ['0044444444','👨‍🏫 مدیر گروه'],['0055555555','🧑‍💼 کارشناس آموزش'],['0066666666','🧑‍⚖️ معاون'],['0000000001','🛡 مدیر سیستم']
];
document.getElementById('demoChips').innerHTML = DEMOS.map(d=>`<button class="chip" onclick="quickLogin('${d[0]}')">${d[1]}</button>`).join('');
function quickLogin(nc){ document.getElementById('loginNc').value = nc; document.getElementById('loginPass').value='123456'; doLogin(); }
async function doLogin(){
  try{
    const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({nationalCode:document.getElementById('loginNc').value.trim(),password:document.getElementById('loginPass').value})});
    const d = await r.json(); if(!r.ok) throw new Error(d.error);
    TOKEN = d.token; tokSet(TOKEN);
    await boot();
  }catch(e){ toast(e.message,'err'); }
}
function logout(){ TOKEN=''; tokDel(); location.reload(); }

/* ═══════════════ راه‌اندازی پنل ═══════════════ */
async function boot(){
  try{ ME = await API('/api/me'); }catch(e){ return; }
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appPage').style.display='flex';
  document.getElementById('uName').textContent = ME.user.name;
  document.getElementById('uRoles').textContent = ME.roles.map(r=>r.title).join('، ');
  buildNav(); navigate(ME.student ? 'dashboard' : (ME.roles.some(r=>r.code==='ADMIN') ? 'regulations' : 'inbox'));
}
const PAGES = [
  {id:'dashboard', icon:'📊', title:'داشبورد', roles:null},
  {id:'enroll',    icon:'🛒', title:'انتخاب واحد', roles:['STUDENT']},
  {id:'schedule',  icon:'📅', title:'برنامه هفتگی', roles:['STUDENT']},
  {id:'grades',    icon:'📝', title:'نمرات ترم جاری', roles:['STUDENT']},
  {id:'examcard',  icon:'🎫', title:'کارت ورود به جلسه', roles:['STUDENT']},
  {id:'transcript',icon:'📜', title:'کارنامه', roles:['STUDENT']},
  {id:'requests',  icon:'📨', title:'درخواست‌های من', roles:['STUDENT']},
  {id:'onboard',    icon:'🚀', title:'ثبت‌نام غیرحضوری', roles:['APPLICANT']},
  {id:'finance',   icon:'💳', title:'امور مالی', roles:['STUDENT']},
  {id:'myclasses', icon:'🏫', title:'کلاس‌های من', roles:['PROFESSOR']},
  {id:'attclass',  icon:'✅', title:'حضور و غیاب کلاسی', roles:['PROFESSOR']},
  {id:'docs',      icon:'📄', title:'قرارداد و ابلاغیه', roles:['PROFESSOR']},
  {id:'mypay',     icon:'💰', title:'فیش حقوقی من', roles:['PROFESSOR']},
  {id:'mybi',      icon:'📈', title:'بازخورد ارزشیابی من', roles:['PROFESSOR']},
  {id:'appeals',   icon:'⚖️', title:'اعتراض به نمرات', roles:['PROFESSOR']},
  {id:'inbox',     icon:'📥', title:'کارتابل گردش کار', roles:['DEP_HEAD','EDU_EXPERT','VICE_EDU','ADMIN','FINANCE_EXPERT']},
  {id:'exams',     icon:'🏛', title:'مدیریت امتحانات', roles:['EDU_EXPERT','VICE_EDU','ADMIN']},
  {id:'attrpt',    icon:'🖐', title:'داشبورد حضور استاد', roles:['EDU_EXPERT','VICE_EDU','ADMIN','DEP_HEAD']},
  {id:'dr',        icon:'🎯', title:'معرفی به استاد', roles:['EDU_EXPERT','ADMIN']},
  {id:'sakha',     icon:'🪖', title:'نظام وظیفه (سخا)', roles:['MILITARY_OFFICER','ADMIN']},
  {id:'archive',    icon:'🗄', title:'بایگانی الکترونیک', roles:['ARCHIVE_EXPERT','ADMIN']},
  {id:'payroll',   icon:'💼', title:'حق‌التدریس و فیش', roles:['FINANCE_EXPERT','ADMIN']},
  {id:'payrules',  icon:'🧾', title:'فرمول‌ساز مالی', roles:['FINANCE_EXPERT','ADMIN']},
  {id:'bi',        icon:'📊', title:'داشبورد ارزشیابی', roles:['DEP_HEAD','VICE_EDU','ADMIN']},
  {id:'regulations',icon:'⚖️', title:'مرکز آیین‌نامه‌ها', roles:['ADMIN']},
  {id:'kpi',       icon:'📈', title:'KPI و گلوگاه‌ها', roles:['ADMIN']},
  {id:'audit',     icon:'🔐', title:'ردگیری امنیتی', roles:['ADMIN']},
];
function buildNav(){
  const codes = ME.roles.map(r=>r.code);
  document.getElementById('navMenu').innerHTML = PAGES
    .filter(p => !p.roles || p.roles.some(x=>codes.includes(x)))
    .map(p => `<button class="nav-item" id="nav-${p.id}" onclick="navigate('${p.id}')"><span>${p.icon}</span> ${p.title}</button>`).join('');
}
async function navigate(page){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const el = document.getElementById('nav-'+page); if(el) el.classList.add('active');
  const area = document.getElementById('mainArea');
  area.innerHTML = '<div class="empty">⏳ در حال بارگذاری...</div>';
  try{ await RENDER[page](area); }catch(e){ area.innerHTML = `<div class="card"><div class="empty">⚠️ ${e.message}</div></div>`; }
}

/* ═══════════════ صفحات ═══════════════ */
const RENDER = {

  /* ── داشبورد ── */
  async dashboard(area){
    const d = await API('/api/offerings');
    const t = d.term;
    let html = `<div class="page-title">${ME.student?'داشبورد دانشجو':'داشبورد'} — ${t.title}</div>`;
    if (d.studentContext){
      const c = d.studentContext, L = c.limits;
      const bal = ME.student ? (await API('/api/my-finance')).balance : 0;
      html += `
      ${c.studentStatus==='BLOCKED_COMMISSION' ? `<div class="appeal-box">⚠️ <b>اخطار آموزشی:</b> وضعیت تحصیلی شما مسدود شده است (${c.blockedEvent==='MAX_PROBATION_REACHED'?'مشروطی بیش از حد مجاز':'اتمام سنوات'}). برای ادامه تحصیل نیازمند رای کمیسیون موارد خاص هستید — <button class="btn btn-amber" style="padding:5px 12px;font-size:12px" onclick="navigate('requests')">ثبت درخواست (سجاد)</button></div>`:''}
      <div class="grid grid-4">
        <div class="stat"><div class="lbl">سقف واحد این ترم</div><div class="val" style="color:var(--primary)">${faNum(L.maxUnits)}</div><div class="hint">${L.reasons.map(faNum).join(' • ')}</div></div>
        <div class="stat"><div class="lbl">واحدهای ثبت‌شده</div><div class="val">${faNum(c.currentUnits ?? 0)}</div><div class="hint">از ${faNum(L.maxUnits)} واحد</div></div>

    area.innerHTML = `

      ${c && c.studentStatus==='BLOCKED_COMMISSION' ? `<div class="appeal-box">⛔ پنل انتخاب واحد به دلیل نیاز به رای کمیسیون موارد خاص مسدود است.</div>`:''}

        <div class="units">🧺 سبد: <b id="cartCount">۰</b> درس — جمع واحد: <b id="cartUnits">۰</b> (سقف شما: ${faNum(c?.limits.maxUnits??'—')})</div>
        <div class="flex">
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#cbd5e1;margin:0"><input type="checkbox" id="allowCouncil" style="width:15px;height:15px"> خطاهای نرم را به شورا ارجاع بده</label>
          <button class="btn btn-green" id="submitBtn" onclick="submitCart()">ثبت نهایی سبد</button>

    list.innerHTML = `<h3 class="sec">دروس ارائه‌شده (${faNum(d.offerings.length)})</h3>` + d.offerings.map(o=>{

      return `<div class="offering" id="off-${o.id}">
        <div style="flex:1;min-width:250px">
          <div class="title-row">
            <span class="code-tag">${o.code}</span>
            <b>${o.title}</b>

            <span class="badge b-gray">${faNum(o.units)} واحد</span>
            ${o.gradingType==='DESCRIPTIVE'?'<span class="badge b-amber">توصیفی</span>':''}
            ${mine==='REGISTERED'?'<span class="badge b-green">ثبت‌شده ✓</span>':''}
            ${mine==='PENDING_COUNCIL'?'<span class="badge b-amber">در انتظار شورا ⏳</span>':''}
            ${mine==='WAITLISTED'?'<span class="badge b-gray">لیست انتظار</span>':''}
          </div>
          <div class="meta">👨‍🏫 ${o.professor||'—'} &nbsp;|&nbsp; ${o.scheduleText||'بدون زمان‌بندی'}</div>
          <div class="cap-bar"><div class="cap-fill ${capCls}" style="width:${pct}%"></div></div>
          <div class="meta">ظرفیت: ${faNum(o.enrolledCount)} / ${faNum(o.capacity)} ${o.waitlistCapacity?`(+ لیست انتظار ${faNum(o.waitlistCapacity)})`:''}</div>
        </div>
        <div class="flex" style="align-self:center">
          ${mine==='REGISTERED'||mine==='WAITLISTED'||mine==='PENDING_COUNCIL'
            ? `<button class="btn btn-red" onclick="dropCourse(${o.id})">حذف</button>`
            : (pct>=100 && !o.waitlistCapacity)
              ? '<span class="badge b-red">تکمیل</span>'
              : `<button class="btn ${inCart?'btn-ghost':'btn-primary'}" onclick="toggleCart(${o.id})">${inCart?'− حذف از سبد':'+ افزودن به سبد'}</button>`}
        </div>
      </div>`;
    }).join('');
    window._offerings = d.offerings;
    window._cart = cart;
    updateCartBar();

function toggleCart(id){
  const off = window._offerings.find(o=>o.id===id);
  if (window._cart.has(id)) window._cart.delete(id); else window._cart.add(id);
  const btn = document.querySelector(`#off-${id} button.btn`);
  if (btn){ btn.className = 'btn '+(window._cart.has(id)?'btn-ghost':'btn-primary'); btn.textContent = window._cart.has(id)?'− حذف از سبد':'+ افزودن به سبد'; }
  updateCartBar();
}
function updateCartBar(){
  const items = [...(window._cart||[])].map(id=>window._offerings.find(o=>o.id===id)).filter(Boolean);
  document.getElementById('cartCount').textContent = faNum(items.length);
  document.getElementById('cartUnits').textContent = faNum(items.reduce((a,o)=>a+Number(o.units),0));
}
async function submitCart(){
  const allowCouncil = document.getElementById('allowCouncil')?.checked;
  const ids = [...(window._cart||[])];
  if (!ids.length) return toast('سبد خالی است','err');
  try{
    const r = await API('/api/enroll/submit',{method:'POST',body:JSON.stringify({offeringIds:ids,allowCouncil})});
    let msg=[];
    if (r.enrolled.length) msg.push(`✅ ${r.enrolled.length} درس قطعی شد`);
    if (r.pendingCouncil.length) msg.push(`⏳ ${r.pendingCouncil.length} درخواست شورا ثبت شد (${r.pendingCouncil.map(p=>p.trackingCode).join(', ')})`);
    if (r.waitlisted.length) msg.push(`📋 ${r.waitlisted.length} درس در لیست انتظار`);
    r.softErrors.forEach(s=>toast('⚠️ '+s.message,'err'));
    r.hardErrors.forEach(h=>toast('⛔ '+h,'err'));
    if (r.enrolled.length||r.pendingCouncil.length) toast(msg.join(' | '),'ok');
    navigate('enroll');
  }catch(e){ toast(e.message,'err'); }
}
async function dropCourse(id){
  if(!confirm('این درس حذف شود؟ در صورت وجود لیست انتظار، نفر بعدی به‌صورت خودکار ارتقا می‌یابد.')) return;
  try{ const r = await API('/api/enroll/drop',{method:'POST',body:JSON.stringify({offeringId:id})});
    toast(r.promoted? 'حذف شد — نفر بعدی لیست انتظار ارتقا یافت ✓':'حذف شد','ok'); navigate('enroll');
  }catch(e){toast(e.message,'err');}
}
async function act(id, action){
  const note = document.getElementById('note-'+id)?.value || '';
  if (action==='REJECT' && !note && !confirm('بدون یادداشت رد شود؟')) return;
  try{ const r = await API('/api/workflow/act',{method:'POST',body:JSON.stringify({requestId:id,action,note})});
    toast(r.final?(action==='APPROVE'?'✅ تایید نهایی شد':'رد نهایی شد'):'به مرحله بعد رفت: '+r.movedTo, 'ok'); navigate('inbox');
  }catch(e){toast(e.message,'err');}
}
async function sendCommission(){
  const code=document.getElementById('sajadCode').value, sem=document.getElementById('extraSem').value;
  try{ const r=await API('/api/requests/commission',{method:'POST',body:JSON.stringify({sajadCode:code,extraSemesters:sem})});
    toast('درخواست ثبت شد — کد رهگیری '+r.trackingCode,'ok'); navigate('requests');
  }catch(e){toast(e.message,'err');}
}

/* ═══════════════ نمودارهای BI (SVG بومی — بدون کتابخانهٔ خارجی) ═══════════════ */
function radarSVG(axes){
  const N = axes.length, R = 104, cx = 160, cy = 148;
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/N; return [ (cx + r*Math.cos(a)).toFixed(1), (cy + r*Math.sin(a)).toFixed(1) ]; };
  let g = '';
  for (let v = 1; v <= 5; v++) g += `<polygon points="${axes.map((_,i)=>pt(i, R*v/5).join(',')).join(' ')}" fill="none" stroke="#e2e8f0"/>`;
  axes.forEach((a,i)=>{
    const [x,y] = pt(i,R); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e8f0"/>`;
    const [lx,ly] = pt(i,R+26);
    g += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#334155">${a.label}</text>`;
    g += `<text x="${lx}" y="${Number(ly)+14}" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0284c7">${faNum(a.mine)}</text>`;
  });
  const poly = key => axes.map((a,i)=>pt(i, R*Math.min(a[key],5)/5).join(',')).join(' ');
  const dots = axes.map((a,i)=>{const [x,y]=pt(i, R*Math.min(a.mine,5)/5);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#0284c7"/>`;}).join('');
  return `<svg viewBox="0 0 320 316" style="max-width:330px;width:100%">
    ${g}
    <polygon points="${poly('dept')}" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="${poly('mine')}" fill="rgba(2,132,199,.22)" stroke="#0284c7" stroke-width="2"/>
    ${dots}</svg>`;
}
function trendSVG(tr, threshold){
  if(!tr.length) return '<div class="reasons">داده‌ای نیست.</div>';
  const W=560,H=210,P=42, min=2.5, max=5;
  const xs = tr.map((_,i)=> P + i*(W-2*P)/Math.max(tr.length-1,1));
  const y = v => H-P - (v-min)/(max-min)*(H-2*P);
  const pts = tr.map((t,i)=>xs[i]+','+y(t.score).toFixed(1)).join(' ');
  const grid = [3,4,5].map(v=>`<line x1="${P}" y1="${y(v)}" x2="${W-P}" y2="${y(v)}" stroke="#e2e8f0"/><text x="${W-P+6}" y="${y(v)+4}" font-size="10" fill="#94a3b8">${faNum(v)}</text>`).join('');
  const thr = (threshold>=min&&threshold<=max)?`<line x1="${P}" y1="${y(threshold)}" x2="${W-P}" y2="${y(threshold)}" stroke="#dc2626" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${P+4}" y="${y(threshold)-5}" font-size="10" fill="#dc2626">آستانهٔ بحرانی ${faNum(threshold)}</text>`:'';
  const labels = tr.map((t,i)=>`<text x="${xs[i]}" y="${H-P+22}" text-anchor="middle" font-size="10.5" fill="#475569">${(t.term||'').replace('نیمسال ','')}</text>
    <text x="${xs[i]}" y="${y(t.score)-12}" text-anchor="middle" font-size="12" font-weight="bold" fill="${t.score<threshold?'#dc2626':'#0284c7'}">${faNum(t.score)}</text>`).join('');
  const dots = tr.map((t,i)=>`<circle cx="${xs[i]}" cy="${y(t.score)}" r="5" fill="${t.score<threshold?'#dc2626':'#0284c7'}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${grid}${thr}
    <polyline points="${pts}" fill="none" stroke="#0284c7" stroke-width="2.5"/>${dots}${labels}</svg>`;
}
function wordCloudHTML(words){
  if(!words.length) return '<div class="reasons">نظر تشریحی ثبت نشده.</div>';
  const mx = words[0].c, pal = ['#0284c7','#7c3aed','#059669','#d97706','#dc2626','#0891b2','#be185d'];
  return words.map((w,i)=>`<span style="font-size:${(13+24*Math.sqrt(w.c/mx)).toFixed(0)}px;color:${pal[i%pal.length]};margin:3px 12px;display:inline-block;font-weight:${w.c>=mx*0.6?'700':'400'}">${w.w} <small style="opacity:.5;font-size:11px">${faNum(w.c)}</small></span>`).join('');
}
