<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>آفلاین — سامانهٔ آفاق</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
        background: #f1f5f9; color: #1e293b;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
        padding: 28px 24px; max-width: 380px; text-align: center;
      }
      .badge {
        width: 56px; height: 56px; border-radius: 16px; background: #e0e7ff;
        color: #4338ca; display: flex; align-items: center; justify-content: center;
        margin: 0 auto 16px; font-size: 28px; font-weight: 700;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 13px; line-height: 1.8; color: #64748b; margin: 0 0 18px; }
      button {
        border: 0; background: #4f46e5; color: #fff; font-weight: 700;
        padding: 10px 22px; border-radius: 12px; font-size: 14px; cursor: pointer;
        font-family: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border-color: #334155; }
        .badge { background: #312e81; color: #a5b4fc; }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">آ</div>
      <h1>اتصال اینترنت قطع است</h1>
      <p>برای استفاده از سامانهٔ آفاق به اینترنت نیاز دارید. پس از برقراری اتصال، دوباره تلاش کنید.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
