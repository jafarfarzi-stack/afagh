# ════════════════════════════════════════════════════════════════════
#  استقرار کامل سامانه آفاق روی Docker — همه‌چیز داخل کانتینر
#      app       → Next.js  (پورت ۸۰۸۰ روی هاست)
#      postgres  → PostgreSQL 16   (فقط روی 127.0.0.1)
#      redis     → Redis 7         (فقط روی 127.0.0.1)
#      minio     → Object Storage  (فقط روی 127.0.0.1)
#
#  اجرا:  docker compose -f docker-compose.prod.yml up -d --build
#  یا با اسکریپت:  sudo ./deploy-debian.sh
# ════════════════════════════════════════════════════════════════════
name: afagh

x-db-env: &db-env
  DATABASE_URL: postgres://afagh:${POSTGRES_PASSWORD:-afagh}@postgres:5432/afagh_db
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: minio
  S3_PORT: "9000"
  S3_BUCKET: ${S3_BUCKET:-afagh-archive}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-afagh}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-afagh-secret}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afagh}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afagh-secret}

services:
  postgres:
    image: postgres:16-alpine
    container_name: afagh_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: afagh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afagh}
      POSTGRES_DB: afagh_db
    volumes: [afagh_pg:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${PG_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afagh -d afagh_db']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: afagh_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [afagh_redis:/data]
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio
    container_name: afagh_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afagh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afagh-secret}
    volumes: [afagh_minio:/data]
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 30

  # یک‌بار اجرا می‌شود: ساخت/به‌روزرسانی جدول‌ها + ایندکس‌ها و RLS
  migrator:
    build:
      context: ./afagh-next
      target: migrator
    image: afagh-migrator:latest
    container_name: afagh_migrator
    restart: "no"
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./afagh-next
      target: runner
    image: afagh-app:latest
    container_name: afagh_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://afagh:${POSTGRES_PASSWORD:-afagh}@postgres:5432/afagh_db
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: minio
      S3_PORT: "9000"
      S3_BUCKET: ${S3_BUCKET:-afagh-archive}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-afagh}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-afagh-secret}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afagh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afagh-secret}
      NODE_ENV: production
      PORT: "8080"
      HOSTNAME: 0.0.0.0
    ports: ['${APP_PORT:-8080}:8080']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  afagh_pg:
  afagh_redis:
  afagh_minio:
