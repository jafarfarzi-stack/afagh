# ════════════════════════════════════════════════════════════════════
#  سامانه جامع آفاق — استقرار کامل با یک دستور
#
#      docker compose up -d --build
#
#  بدون هیچ تنظیم اضافه کار می‌کند؛ برای سفارشی‌سازی یک فایل .env کنار
#  همین فایل بسازید (نمونه: .env.prod.example). هر متغیری که تعریف نکنید،
#  مقدار پیش‌فرض زیر استفاده می‌شود.
#
#      app       → Next.js            روی پورت ${APP_PORT:-8080} هاست
#      postgres  → PostgreSQL 16      فقط روی 127.0.0.1
#      redis     → Redis 7            فقط روی 127.0.0.1
#      minio     → Object Storage     فقط روی 127.0.0.1
#      migrator  → یک‌بار اجرا: ساخت جدول‌ها + ایندکس‌ها + RLS
#
#  دستورهای پرکاربرد:
#      docker compose ps                 وضعیت
#      docker compose logs -f app        لاگ زنده
#      docker compose restart app        ری‌استارت
#      docker compose down               توقف (داده حفظ می‌شود)
#      docker compose down -v            توقف + حذف کامل داده
#      make help                         میان‌بُرهای آماده
#
#  اجرای همراه با HTTPS خودکار (دامنه):
#      DOMAIN=edu.example.ac.ir docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# ════════════════════════════════════════════════════════════════════
name: afagh

# ── متغیرهای مشترک سرویس‌های اپ ──
x-app-env: &app-env
  # زیرساخت (فقط از همین‌جا خوانده می‌شود)
  DATABASE_URL: postgres://afagh:${POSTGRES_PASSWORD:-afagh}@postgres:5432/afagh_db
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: minio
  S3_PORT: "9000"
  S3_BUCKET: ${S3_BUCKET:-afagh-archive}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-afagh}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-afagh-secret}
  # عمومی — بقیهٔ مقادیر از پنل مدیر ← «پیکربندی سامانه» قابل تنظیم‌اند
  AFAGH_UNIVERSITY_NAME: ${AFAGH_UNIVERSITY_NAME:-دانشگاه آفاق}
  AFAGH_PUBLIC_BASE_URL: ${AFAGH_PUBLIC_BASE_URL:-http://localhost:8080}
  AFAGH_SUPPORT_EMAIL: ${AFAGH_SUPPORT_EMAIL:-}
  AFAGH_SUPPORT_PHONE: ${AFAGH_SUPPORT_PHONE:-}
  # کلاس مجازی
  BIGBLUEBUTTON_URL: ${BIGBLUEBUTTON_URL:-}
  BIGBLUEBUTTON_SECRET: ${BIGBLUEBUTTON_SECRET:-}
  BIGBLUEBUTTON_MODERATOR_PW: ${BIGBLUEBUTTON_MODERATOR_PW:-}
  BIGBLUEBUTTON_ATTENDEE_PW: ${BIGBLUEBUTTON_ATTENDEE_PW:-}
  BIGBLUEBUTTON_AUTO_RECORD: ${BIGBLUEBUTTON_AUTO_RECORD:-false}
  MOODLE_URL: ${MOODLE_URL:-}
  MOODLE_TOKEN: ${MOODLE_TOKEN:-}
  # پیامک و ربات‌ها
  SMS_PROVIDER: ${SMS_PROVIDER:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  SMS_SENDER: ${SMS_SENDER:-}
  BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
  BALE_CHANNEL_ID: ${BALE_CHANNEL_ID:-}
  EITAA_BOT_TOKEN: ${EITAA_BOT_TOKEN:-}
  EITAA_CHANNEL_ID: ${EITAA_CHANNEL_ID:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
  # درگاه پرداخت
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  PAYMENT_TERMINAL_ID: ${PAYMENT_TERMINAL_ID:-}
  PAYMENT_MERCHANT_ID: ${PAYMENT_MERCHANT_ID:-}
  PAYMENT_MERCHANT_KEY: ${PAYMENT_MERCHANT_KEY:-}
  PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-}
  PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
  PAYMENT_WAGE_PERCENT: ${PAYMENT_WAGE_PERCENT:-0}
  # سرویس‌های استعلام
  IRANDOC_BASE_URL: ${IRANDOC_BASE_URL:-}
  IRANDOC_TOKEN: ${IRANDOC_TOKEN:-}
  KYC_BASE_URL: ${KYC_BASE_URL:-}
  KYC_API_KEY: ${KYC_API_KEY:-}
  SHAPARAK_BASE_URL: ${SHAPARAK_BASE_URL:-}
  SAJJAD_BASE_URL: ${SAJJAD_BASE_URL:-}
  SAJJAD_PORTAL_URL: ${SAJJAD_PORTAL_URL:-https://portal.saorg.ir}
  API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-10}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: afagh_pg
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: afagh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afagh}
      POSTGRES_DB: afagh_db
      # برای نمایش صحیح متن فارسی در مرتب‌سازی و جست‌وجو
      LANG: C.UTF-8
    volumes:
      - afagh_pg:/var/lib/postgresql/data
    ports: ['127.0.0.1:${PG_HOST_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afagh -d afagh_db']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: afagh_redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes: [afagh_redis:/data]
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio
    container_name: afagh_minio
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afagh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afagh-secret}
    volumes: [afagh_minio:/data]
    ports:
      - '127.0.0.1:${MINIO_HOST_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 30

  # یک‌بار اجرا می‌شود و تمام: ساخت/به‌روزرسانی جدول‌ها، ایندکس‌ها و RLS
  migrator:
    build:
      context: ./afagh-next
      target: migrator
    image: afagh-migrator:latest
    container_name: afagh_migrator
    restart: "no"
    logging: *default-logging
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./afagh-next
      target: runner
      args:
        # روی سرور کم‌حافظه کمترش کنید (مثلاً 1536) — .env: NODE_MAX_OLD_SPACE=1536
        NODE_MAX_OLD_SPACE: ${NODE_MAX_OLD_SPACE:-3072}
    image: afagh-app:latest
    container_name: afagh_app
    restart: unless-stopped
    logging: *default-logging
    environment: *app-env
    ports: ['${APP_PORT:-8080}:8080']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  afagh_pg:
  afagh_redis:
  afagh_minio:
